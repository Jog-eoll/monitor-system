version: '3.8'

services:
  publish-gateway-mysql:
    image: mysql:5.7
    container_name: publish-gateway-mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=udp_proxy_gateway
      - MYSQL_USER=${MYSQL_APP_USER:?set MYSQL_APP_USER in .env}
      - MYSQL_PASSWORD=${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  publish-gateway-redis:
    image: redis:7-alpine
    container_name: publish-gateway-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./redis/data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  publish-gateway:
    image: gateway-udp-proxy:${GATEWAY_VERSION:-1.0.0}
    container_name: gateway-udp-proxy
    network_mode: host
    privileged: true
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      - LD_LIBRARY_PATH=/app/lib
      - DB_HOST=127.0.0.1
      - DB_PORT=${MYSQL_HOST_PORT:-3307}
      - DB_USERNAME=${MYSQL_APP_USER:?set MYSQL_APP_USER in .env}
      - DB_PASSWORD=${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=${REDIS_HOST_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - REDIS_DATABASE=${REDIS_DATABASE:-2}
      - MONITOR_HOST=${MONITOR_HOST:?set MONITOR_HOST in .env}
      - MONITOR_CONTENT_PORT=${MONITOR_CONTENT_PORT:-8065}
      - MONITOR_UKEY_PORT=${MONITOR_UKEY_PORT:-8063}
      - MONITOR_DEVICE_PORT=${MONITOR_DEVICE_PORT:-8062}
      - MQTT_AGENT_ENABLED=${MQTT_AGENT_ENABLED:-true}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:?set MQTT_BROKER_URL in .env}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-publish-gateway-001}
      - MQTT_TENANT_ID=${MQTT_TENANT_ID:-default}
      - MQTT_SITE_ID=${MQTT_SITE_ID:-site-001}
      - MQTT_RECONNECT_INTERVAL_MS=${MQTT_RECONNECT_INTERVAL_MS:-30000}
      - MQTT_COMMAND_DEDUP_TTL_MS=${MQTT_COMMAND_DEDUP_TTL_MS:-86400000}
      - MQTT_DEDUP_CLEANUP_INTERVAL_MS=${MQTT_DEDUP_CLEANUP_INTERVAL_MS:-600000}
      - MQTT_TRUSTSTORE_PATH=${MQTT_TRUSTSTORE_PATH:-}
      - MQTT_TRUSTSTORE_PASSWORD=${MQTT_TRUSTSTORE_PASSWORD:-}
      - VAUTH_MOCK_MODE=${VAUTH_MOCK_MODE:-false}
      - VAUTH_DEVICE_TYPE=${VAUTH_DEVICE_TYPE:-ukey}
      - VAUTH_PASSWORD=${VAUTH_PASSWORD:?set VAUTH_PASSWORD in .env}
      - VAUTH_AUTH_ID=${VAUTH_AUTH_ID:?set VAUTH_AUTH_ID in .env}
      - VAUTH_SERVER_ID=${VAUTH_SERVER_ID:?set VAUTH_SERVER_ID in .env}
      - VAUTH_UKEY_PATH=${VAUTH_UKEY_PATH:-}
      - VAUTH_UKEY_SN=${VAUTH_UKEY_SN:-}
      - VAUTH_UKEY_CER_SN=${VAUTH_UKEY_CER_SN:-}
      - VAUTH_UKEY_CER_ID=${VAUTH_UKEY_CER_ID:-}
      - VAUTH_SVAC_MODE=${VAUTH_SVAC_MODE:-false}
      - SECURE_PUBLISH_ENABLED=${SECURE_PUBLISH_ENABLED:-false}
      - SECURE_PUBLISH_TRUST_STORE_DIR=${SECURE_PUBLISH_TRUST_STORE_DIR:-/opt/publish-gateway/trust}
      - SECURE_PUBLISH_TRUSTED_KEY_IDS=${SECURE_PUBLISH_TRUSTED_KEY_IDS:-}
      - SECURE_PUBLISH_DEFAULT_KEY_ID=${SECURE_PUBLISH_DEFAULT_KEY_ID:-default}
      - SECURE_PUBLISH_VERIFIER_PUBLIC_KEY_PATH=${SECURE_PUBLISH_VERIFIER_PUBLIC_KEY_PATH:-}
      - SECURE_PUBLISH_PACKAGE_EXTENSIONS=${SECURE_PUBLISH_PACKAGE_EXTENSIONS:-tar,spkg,zip}
      - CLIENT_RELAY_ENABLED=${CLIENT_RELAY_ENABLED:-true}
      - CLIENT_RELAY_PORT=${CLIENT_RELAY_PORT:-18092}
      - CLIENT_RELAY_TRUSTED_IPS=${CLIENT_RELAY_TRUSTED_IPS:-}
      - CLIENT_RELAY_VERIFY_SIGNATURE=${CLIENT_RELAY_VERIFY_SIGNATURE:-false}
      - CLIENT_RELAY_SIGNATURE_SECRET=${CLIENT_RELAY_SIGNATURE_SECRET:-}
      - CLIENT_RELAY_REJECT_DIRECT_UDP=${CLIENT_RELAY_REJECT_DIRECT_UDP:-false}
      - PROVIDER_JMDNS_ENABLED=${PROVIDER_JMDNS_ENABLED:-true}
      - PROVIDER_JMDNS_BIND_ADDRESS=${PROVIDER_JMDNS_BIND_ADDRESS:-}
      - PROVIDER_JMDNS_ADVERTISE_HOST=${PROVIDER_JMDNS_ADVERTISE_HOST:-}
      - REGISTRY_CLIENT_ID=${REGISTRY_CLIENT_ID:-}
      - DEVICE_VERSION=${DEVICE_VERSION:-1.0.0}
      - DEVICE_LOCATION=${DEVICE_LOCATION:-}
      - DEVICE_MANUFACTURER=${DEVICE_MANUFACTURER:-}
      - DEVICE_MODEL=${DEVICE_MODEL:-gateway-udp-proxy}
      - DEVICE_REMARK=${DEVICE_REMARK:-}
    volumes:
      - ./lib:/app/lib
      - ./certs:/app/certs
      - ./trust:/opt/publish-gateway/trust:ro
      - ./secure-publish/rejected:/opt/publish-gateway/secure-publish/rejected
      - ./application.yml:/app/config/application.yml:ro
      - /dev/bus/usb:/dev/bus/usb
      - ./logs:/app/logs
    depends_on:
      publish-gateway-mysql:
        condition: service_healthy
      publish-gateway-redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
