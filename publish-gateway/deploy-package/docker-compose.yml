version: '3.8'

services:
  # ========== MySQL 数据库（已切换到外部 MySQL，不再自建容器） ==========
  # 原因：宿主机已有稳定运行的 mysql 容器（端口 3306），自建 MySQL 使用 host 网络模式会端口冲突导致 Restarting
  # 前置条件：外部 MySQL 中须手动创建 udp_proxy_gateway 数据库并导入 udp_proxy_rule 表结构
  # .env 中的 DB_USERNAME / DB_PASSWORD 须填写外部 MySQL 的有效账号密码

  # Redis 缓存（内容缓存：FILE_PLAY 播放指令命中复用）
  publish-gateway-redis:
    image: redis:7-alpine
    container_name: publish-gateway-redis
    network_mode: host
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  publish-gateway:
    image: gateway-udp-proxy:1.0.0
    container_name: gateway-udp-proxy
    # host 网络模式：直接监听宿主机 UDP 端口，无需逐一映射；同时访问宿主机 USB UKey 设备
    network_mode: host
    # privileged：允许容器访问 USB 设备（UKey 硬件必须）
    privileged: true
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      # 告知 OS 动态链接器去 /app/lib 查找 libvauthsdk.so 的级联依赖库（libCommonLib.so 等）
      - LD_LIBRARY_PATH=/app/lib
      # 数据库配置：MySQL 与本服务同在 host 网络，使用 127.0.0.1 访问
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis 配置：Redis 与本服务同在 host 网络，使用 127.0.0.1 访问
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DATABASE=2
      # MinIO 配置
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      # 管控平台地址
      - MONITOR_HOST=${MONITOR_HOST}
      - MONITOR_CONTENT_PORT=${MONITOR_CONTENT_PORT:-8065}
      - MONITOR_UKEY_PORT=${MONITOR_UKEY_PORT:-8063}
      - MONITOR_DEVICE_PORT=${MONITOR_DEVICE_PORT:-8062}
      - MONITOR_LOG_URL=${MONITOR_LOG_URL:-http://${MONITOR_HOST:-127.0.0.1}:8071}
      # MQTT Agent 配置：发布网关主动连接公网 EMQX，默认关闭
      - MQTT_AGENT_ENABLED=${MQTT_AGENT_ENABLED:-true}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-ssl://127.0.0.1:8883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-publish-gateway-001}
      - MQTT_TENANT_ID=${MQTT_TENANT_ID:-default}
      - MQTT_SITE_ID=${MQTT_SITE_ID:-site-001}
      - MQTT_RECONNECT_INTERVAL_MS=${MQTT_RECONNECT_INTERVAL_MS:-30000}
      - MQTT_COMMAND_DEDUP_TTL_MS=${MQTT_COMMAND_DEDUP_TTL_MS:-86400000}
      - MQTT_DEDUP_CLEANUP_INTERVAL_MS=${MQTT_DEDUP_CLEANUP_INTERVAL_MS:-600000}
      - MQTT_TRUSTSTORE_PATH=${MQTT_TRUSTSTORE_PATH:-}
      - MQTT_TRUSTSTORE_PASSWORD=${MQTT_TRUSTSTORE_PASSWORD:-}
      - MQTT_REGISTER_ENABLED=${MQTT_REGISTER_ENABLED:-true}
      - MQTT_REGISTER_ON_CONNECT=${MQTT_REGISTER_ON_CONNECT:-true}
      - MQTT_REGISTER_INTERVAL_SEC=${MQTT_REGISTER_INTERVAL_SEC:-300}
      - MQTT_REGISTER_SERVICE_NAME=${MQTT_REGISTER_SERVICE_NAME:-publish-gateway}
      - MQTT_REGISTER_HOST=${MQTT_REGISTER_HOST:-}
      - MQTT_REGISTER_PORT=${MQTT_REGISTER_PORT:-8092}
      - MQTT_REGISTER_MAC=${MQTT_REGISTER_MAC:-}
      - MQTT_REGISTER_LOCATION=${MQTT_REGISTER_LOCATION:-}
      - MQTT_REGISTER_VERSION=${MQTT_REGISTER_VERSION:-}
      - MQTT_REGISTER_MANUFACTURER=${MQTT_REGISTER_MANUFACTURER:-}
      - MQTT_REGISTER_MODEL=${MQTT_REGISTER_MODEL:-}
      - MQTT_REGISTER_REMARK=${MQTT_REGISTER_REMARK:-}
      - MQTT_HTTP_FORWARD_TIMEOUT_MS=${MQTT_HTTP_FORWARD_TIMEOUT_MS:-15000}
      - CONTROL_DELIVERY_MQTT_FINAL_REPLY_POLL_INTERVAL_MS=${CONTROL_DELIVERY_MQTT_FINAL_REPLY_POLL_INTERVAL_MS:-1000}
      - CONTROL_DELIVERY_MQTT_FINAL_REPLY_TIMEOUT_MS=${CONTROL_DELIVERY_MQTT_FINAL_REPLY_TIMEOUT_MS:-60000}
      # VAuth 国密配置
      - VAUTH_MOCK_MODE=false
      - VAUTH_DEVICE_TYPE=${VAUTH_DEVICE_TYPE}
      - VAUTH_PASSWORD=${VAUTH_PASSWORD}
      - VAUTH_AUTH_ID=${VAUTH_AUTH_ID}
      - VAUTH_SERVER_ID=${VAUTH_SERVER_ID}
      - VAUTH_UKEY_PATH=${VAUTH_UKEY_PATH:-}
      - VAUTH_UKEY_SN=${VAUTH_UKEY_SN:-}
      - VAUTH_UKEY_CER_SN=${VAUTH_UKEY_CER_SN:-}
      - VAUTH_UKEY_CER_ID=${VAUTH_UKEY_CER_ID:-}
      - VAUTH_SVAC_MODE=${VAUTH_SVAC_MODE:-false}
      - VAUTH_PAYLOAD_DEBUG_LOG_ENABLED=${VAUTH_PAYLOAD_DEBUG_LOG_ENABLED:-false}
      - VAUTH_SVAC_MATRIX_TEST_ENABLED=${VAUTH_SVAC_MATRIX_TEST_ENABLED:-false}
      - VAUTH_SVAC_MODULE_REQUIRED=${VAUTH_SVAC_MODULE_REQUIRED:-false}
      - VAUTH_SVAC_MODULE_DEVICE_PATH=${VAUTH_SVAC_MODULE_DEVICE_PATH:-}
      - VAUTH_SVAC_MODULE_SYSFS_ROOT=${VAUTH_SVAC_MODULE_SYSFS_ROOT:-/sys/bus/usb/devices}
      - VAUTH_SVAC_MODULE_VENDOR_ID=${VAUTH_SVAC_MODULE_VENDOR_ID:-}
      - VAUTH_SVAC_MODULE_PRODUCT_ID=${VAUTH_SVAC_MODULE_PRODUCT_ID:-}
      - VAUTH_SVAC_MODULE_SERIAL=${VAUTH_SVAC_MODULE_SERIAL:-}
      - VAUTH_SVAC_MODULE_SCAN_INTERVAL_MS=${VAUTH_SVAC_MODULE_SCAN_INTERVAL_MS:-200}
      # Sigma Play 安全包验签配置
      - SECURE_PUBLISH_ENABLED=${SECURE_PUBLISH_ENABLED:-false}
      - SECURE_PUBLISH_TRUST_STORE_DIR=${SECURE_PUBLISH_TRUST_STORE_DIR:-/opt/publish-gateway/trust}
      - SECURE_PUBLISH_TRUSTED_KEY_IDS=${SECURE_PUBLISH_TRUSTED_KEY_IDS:-default}
      - SECURE_PUBLISH_DEFAULT_KEY_ID=${SECURE_PUBLISH_DEFAULT_KEY_ID:-default}
      - SECURE_PUBLISH_VERIFIER_PUBLIC_KEY_PATH=${SECURE_PUBLISH_VERIFIER_PUBLIC_KEY_PATH:-}
      - SECURE_PUBLISH_PACKAGE_EXTENSIONS=${SECURE_PUBLISH_PACKAGE_EXTENSIONS:-tar,spkg,zip}
      - SECURE_PUBLISH_REQUIRE_AUDIT_PASS=${SECURE_PUBLISH_REQUIRE_AUDIT_PASS:-true}
      - SECURE_PUBLISH_REQUIRE_CONTENT_ALLOW=${SECURE_PUBLISH_REQUIRE_CONTENT_ALLOW:-true}
      - SECURE_PUBLISH_REQUIRE_NOT_EXPIRED=${SECURE_PUBLISH_REQUIRE_NOT_EXPIRED:-true}
      - SECURE_PUBLISH_MAX_PACKAGE_SIZE_MB=${SECURE_PUBLISH_MAX_PACKAGE_SIZE_MB:-500}
      - SECURE_PUBLISH_ASSEMBLY_TIMEOUT_MS=${SECURE_PUBLISH_ASSEMBLY_TIMEOUT_MS:-120000}
      - SECURE_PUBLISH_STALE_GAP_MS=${SECURE_PUBLISH_STALE_GAP_MS:-30000}
      - SECURE_PUBLISH_REJECTED_DIR=${SECURE_PUBLISH_REJECTED_DIR:-/opt/publish-gateway/secure-publish/rejected}
      - SECURE_PUBLISH_JPEG_ENABLED=${SECURE_PUBLISH_JPEG_ENABLED:-true}
      - SECURE_PUBLISH_JPEG_MODE=${SECURE_PUBLISH_JPEG_MODE:-audit}
      - SECURE_PUBLISH_JPEG_REQUIRE_BLOCK=${SECURE_PUBLISH_JPEG_REQUIRE_BLOCK:-false}
      - SECURE_PUBLISH_JPEG_REQUIRE_SIGNATURE=${SECURE_PUBLISH_JPEG_REQUIRE_SIGNATURE:-true}
      - SECURE_PUBLISH_JPEG_REQUIRE_CONTENT_ALLOW=${SECURE_PUBLISH_JPEG_REQUIRE_CONTENT_ALLOW:-true}
      - SECURE_PUBLISH_JPEG_REQUIRE_NOT_EXPIRED=${SECURE_PUBLISH_JPEG_REQUIRE_NOT_EXPIRED:-true}
      - SECURE_DELIVERY_PERMIT_HMAC_SECRET=${SECURE_DELIVERY_PERMIT_HMAC_SECRET:-ChangeMe_Sigma_Permit_Secret_32Bytes!}
      - SECURE_DELIVERY_TERMINAL_GW_URL=${SECURE_DELIVERY_TERMINAL_GW_URL:-http://127.0.0.1:8093}
      - SECURE_DELIVERY_LARGE_FILE_REF_ENABLED=${SECURE_DELIVERY_LARGE_FILE_REF_ENABLED:-true}
      - SECURE_DELIVERY_DOWNLOAD_TIMEOUT_MS=${SECURE_DELIVERY_DOWNLOAD_TIMEOUT_MS:-900000}
      - SECURE_DELIVERY_DOWNLOAD_MAX_FILE_SIZE_MB=${SECURE_DELIVERY_DOWNLOAD_MAX_FILE_SIZE_MB:-2048}
      - SECURE_DELIVERY_ENVELOPE_ENABLED=${SECURE_DELIVERY_ENVELOPE_ENABLED:-false}
      - SECURE_DELIVERY_ENVELOPE_SCHEMA_VERSION=${SECURE_DELIVERY_ENVELOPE_SCHEMA_VERSION:-2.0}
      - SECURE_DELIVERY_TERMINAL_HTTP_CONNECT_TIMEOUT_MS=${SECURE_DELIVERY_TERMINAL_HTTP_CONNECT_TIMEOUT_MS:-5000}
      - SECURE_DELIVERY_TERMINAL_HTTP_READ_TIMEOUT_MS=${SECURE_DELIVERY_TERMINAL_HTTP_READ_TIMEOUT_MS:-900000}
      # info-publish-client 中继入口配置
      - CLIENT_RELAY_ENABLED=${CLIENT_RELAY_ENABLED:-true}
      - CLIENT_RELAY_PORT=${CLIENT_RELAY_PORT:-18092}
      - CLIENT_RELAY_TRUSTED_IPS=${CLIENT_RELAY_TRUSTED_IPS:-}
      - CLIENT_RELAY_VERIFY_SIGNATURE=${CLIENT_RELAY_VERIFY_SIGNATURE:-false}
      - CLIENT_RELAY_SIGNATURE_SECRET=${CLIENT_RELAY_SIGNATURE_SECRET:-}
      - CLIENT_RELAY_REJECT_DIRECT_UDP=${CLIENT_RELAY_REJECT_DIRECT_UDP:-false}
      - MONITOR_CONTENT_URL=${MONITOR_CONTENT_URL:-}
      - CONTROL_PLATFORM_URL=${CONTROL_PLATFORM_URL:-}
      - DIAGNOSTIC_LOG_ENABLED=${DIAGNOSTIC_LOG_ENABLED:-true}
      - GATEWAY_DIAGNOSTICS_ENABLED=${GATEWAY_DIAGNOSTICS_ENABLED:-false}
      - LOG_REPORT_TOKEN=${LOG_REPORT_TOKEN:-}
      - CLIENT_PORT=${CLIENT_PORT:-7080}
      - CLIENT_VALIDATE_TIMEOUT_MS=${CLIENT_VALIDATE_TIMEOUT_MS:-2000}
      - PER_PACKET_CLIENT_VALIDATION_ENABLED=${PER_PACKET_CLIENT_VALIDATION_ENABLED:-false}
      - SYSTEM_NETWORK_CHANGE_ENABLED=${SYSTEM_NETWORK_CHANGE_ENABLED:-false}
      - SYSTEM_NETWORK_CHANGE_ALLOWED_INTERFACES=${SYSTEM_NETWORK_CHANGE_ALLOWED_INTERFACES:-}
      - SYSTEM_NETWORK_CHANGE_ROLLBACK_DIR=${SYSTEM_NETWORK_CHANGE_ROLLBACK_DIR:-/tmp}
      - SYSTEM_NETWORK_CHANGE_COMMAND_TIMEOUT_MS=${SYSTEM_NETWORK_CHANGE_COMMAND_TIMEOUT_MS:-10000}
    volumes:
      # SDK 动态库目录（libvauthsdk.so 及依赖库）
      - ./lib:/app/lib
      # 证书目录（签名证书 .cer 文件）
      - ./certs:/app/certs
      # Sigma Play 安全包验签公钥目录
      - ./trust:/opt/publish-gateway/trust:ro
      # Sigma Play 安全包拒绝记录目录
      - ./secure-publish/rejected:/opt/publish-gateway/secure-publish/rejected
      # 外部化配置（覆盖 JAR 内的 application.yml，设置 mock-mode: false 等生产参数）
      - ./application.yml:/app/config/application.yml:ro
      # USB UKey 设备（Linux 通过 /dev/bus/usb 识别 UKey 硬件）
      - /dev/bus/usb:/dev/bus/usb
      - /sys/bus/usb:/sys/bus/usb:ro
      # 日志目录
      - ./logs:/app/logs
    depends_on:
      publish-gateway-redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
