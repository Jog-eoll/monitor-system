spring:
  main:
    web-application-type: reactive
  application:
    name: monitor-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_IP_PORT:192.168.1.47:8848}
        namespace: ${NACOS_NAMESPACE:5c87647a-8a17-4adb-94ce-04047ea26d96}
      config:
        server-addr: ${NACOS_IP_PORT:192.168.1.47:8848}
        namespace: ${NACOS_NAMESPACE:5c87647a-8a17-4adb-94ce-04047ea26d96}
        file-extension: yml
        enabled: true
        refresh-enabled: true
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      transport:
        dashboard: ${SENTINEL_IP_PORT:192.168.1.47:8858}
        port: ${SENTINEL_PORT:10000}
      eager: true
