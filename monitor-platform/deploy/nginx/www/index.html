  <style>
    /* 防止页面刷新时白屏的初始样式 */
    html {
      background-color: #fafbfc;
    }

    html.dark {
      background-color: #070707;
    }
  </style>

  <script>
    // 初始化 html class 主题属性
    ; (function() {
      try {
        if (typeof Storage === 'undefined' || !window.localStorage) {
          return
        }

        const themeType =
          localStorage.getItem('monitor-platform-theme') || localStorage.getItem('sys-theme')
        if (themeType === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        console.warn('Failed to apply initial theme:', e)
      }
    })()
  </script>
