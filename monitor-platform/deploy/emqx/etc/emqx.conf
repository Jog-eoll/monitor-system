## EMQX 5 Configuration for Monitor Platform
## Mounted to /opt/emqx/etc/emqx.conf in the container

## Node
node {
  name = "emqx@127.0.0.1"
  cookie = "monitor-platform-emqx-cookie"
  data_dir = "/opt/emqx/data"
}

## Listeners
## 1883 -> 仅保留内网联调；公网接入统一走 8883
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024
  proxy_protocol = false
}

## 8883 -> 公网 MQTT over TLS，使用公司域名证书
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 512
  ssl_options {
    certfile = "/opt/emqx/etc/certs/fullchain.pem"
    keyfile = "/opt/emqx/etc/certs/privkey.pem"
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

## Dashboard
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "admin"
  default_password = "public"
}

## Logging
log {
  console_handler {
    level = warning
  }
}

## MQTT protocol settings
mqtt {
  max_packet_size = "1MB"
  max_clientid_len = 128
  max_topic_levels = 10
  max_qos_allowed = 2
  retain_available = true
  wildcard_subscription = true
  shared_subscription = true
}

## 禁止匿名连接：所有客户端必须通过 /mqtt/auth 认证
allow_anonymous = false

## HTTP 认证 —— EMQX 在客户端连接时回调平台 /mqtt/auth
authentication {
  mechanism = password_based
  backend = http
  method = post
  url = "http://monitor-forward:8067/mqtt/auth"
  body {
    clientid = "${clientid}"
    username = "${username}"
    password = "${password}"
    ipaddress = "${peerhost}"
  }
  headers {
    "content-type" = "application/json"
  }
  pool_size = 8
  connect_timeout = "5s"
  request_timeout = "5s"
}

## HTTP ACL —— EMQX 在客户端 pub/sub 时回调平台 /mqtt/acl
authorization {
  no_match = deny
  deny_action = deny
  sources = [
    {
      type = http
      url = "http://monitor-forward:8067/mqtt/acl"
      method = post
      body {
        clientid = "${clientid}"
        username = "${username}"
        ipaddress = "${peerhost}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
      }
      pool_size = 8
      connect_timeout = "5s"
      request_timeout = "5s"
    },
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
