%% EMQX ACL Rules for Monitor Platform
%% 本文件保留基础兜底规则，设备级细粒度 ACL 已迁移到 HTTP 回调 /mqtt/acl
%% 注意：emqx.conf 中 authorization.no_match 已设为 deny，因此此处不允许兜底

%% 拒绝所有客户端访问 $SYS 系统主题（仅 Dashboard localhost 例外）
{deny, all, subscribe, ["$SYS/#"]}.
{deny, all, publish, ["$SYS/#"]}.

%% 默认显式拒绝 —— 任何未命中 HTTP ACL 的发布订阅都应被拒绝
%% （与 emqx.conf no_match = deny 双重兜底）
{deny, all}.
