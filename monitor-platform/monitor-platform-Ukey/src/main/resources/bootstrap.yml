spring:
  application:
    name: monitor-ukey
  profiles:
    active: dev
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_IP_PORT:192.168.1.31:8848}
        namespace: ${NACOS_NAMESPACE:5c87647a-8a17-4adb-94ce-04047ea26d96}
      config:
        server-addr: ${NACOS_IP_PORT:192.168.1.31:8848}
        namespace: ${NACOS_NAMESPACE:5c87647a-8a17-4adb-94ce-04047ea26d96}
        file-extension: yml
        enabled: true
        refresh-enabled: true
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      transport:
        dashboard: ${SENTINEL_IP_PORT:192.168.1.31:8858}
        port: ${SENTINEL_PORT:10005}
      eager: true

# UKey 管理配置
ukey:
  admin:
    username: ${UKEY_ADMIN_USERNAME:}
    password: ${UKEY_ADMIN_PASSWORD:}
  # 密码传输加密密钥（用于前端加密、后端解密）
  # 建议使用 OpenSSL 或 EncryptUtil.generateKey() 生成 32 字节 Base64 密钥
  # 示例: openssl rand -base64 32
  # 注意：
  # 1. 此密钥必须与前端加密使用的密钥一致
  # 2. 生产环境必须配置，建议通过环境变量 UKEY_PASSWORD_ENCRYPT_KEY 设置
  # 3. 未配置时，后端将兼容接收明文密码（向后兼容）
  password:
    encrypt-key: ${UKEY_PASSWORD_ENCRYPT_KEY:l3/ltPCoAM32zj/sizEHG5m+oAfsgfOQjtNZnUYe5TE=}
