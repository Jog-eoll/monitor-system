spring:
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  # 环境 dev:开发环境|test:测试环境|prod:生产环境
  profiles:
    active: dev #激活的配置文件
  application:
    # 微服务名称
    name: register-service
  cloud:
    nacos:
      #prefix: dev
      discovery:
        # 设置命名空间
        namespace: ${NACOS_NAMESPACE:5c87647a-8a17-4adb-94ce-04047ea26d96}
        # nacos服务发现地址, 多个地址使用逗号隔开, 注意: 不用添加http(s)://
        server-addr: ${NACOS_IP_PORT:192.168.1.175:8848}
      config:
        # 设置命名空间
        namespace: ${NACOS_NAMESPACE:5c87647a-8a17-4adb-94ce-04047ea26d96}
        # nacos服务配置地址, 多个地址使用逗号隔开, 注意: 不用添加http(s)://
        server-addr: ${NACOS_IP_PORT:192.168.1.175:8848}
        # 配置文件类型
        file-extension: yml
        #group: DEFAULT_GROUP
        enabled: true
        refresh-enabled: true
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      transport:
        dashboard: ${SENTINEL_IP_PORT:192.168.1.31:8858}
        port: ${SENTINEL_PORT:10000}
      eager: true

