server:
  port: 7081
  tomcat:
    max-http-form-post-size: 2300MB
    max-swallow-size: -1

client:
  log:
    encode:
      enabled: false

spring:
  application:
    name: info-publish-client
  cloud:
    compatibility-verifier:
      enabled: false
  servlet:
    multipart:
      max-file-size: ${CONTENT_PUBLISH_MULTIPART_MAX_FILE_SIZE:6144MB}
      max-request-size: ${CONTENT_PUBLISH_MULTIPART_MAX_REQUEST_SIZE:7168MB}
      file-size-threshold: 0B

registry:
  client:
    enabled: true
    server-addr: 192.168.1.25:8069
    api-prefix: /registry
    register-path: /register
    service-name: info-publish-client
    device-type: publish_server
    preferred-network: "192.168.1."
    auto-register: true
    auto-deregister: true
    heartbeat-interval: 10000
  config-db:
    enabled: true
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://192.168.1.31:3306/monitor_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    query-timeout-seconds: 5

monitor-platform:
  client-id: ""

provider:
  jmdns:
    enabled: ${PROVIDER_JMDNS_ENABLED:true}
    bind-address: ${PROVIDER_JMDNS_BIND_ADDRESS:}
    advertise-host: ${PROVIDER_JMDNS_ADVERTISE_HOST:}

control-command:
  gateway-url: ${CONTROL_COMMAND_GATEWAY_URL:http://192.168.1.25:8092}

http-client:
  connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:30000}
  read-timeout-ms: ${HTTP_CLIENT_READ_TIMEOUT_MS:600000}

content-publish:
  gateway-url: ${CONTENT_PUBLISH_GATEWAY_URL:${CONTROL_COMMAND_GATEWAY_URL:http://192.168.1.25:8092}}
  download-timeout-ms: ${CONTENT_PUBLISH_DOWNLOAD_TIMEOUT_MS:600000}
  max-file-size-mb: ${CONTENT_PUBLISH_MAX_FILE_SIZE_MB:50}
  v2:
    file-download-base-url: ${CONTENT_PUBLISH_V2_FILE_DOWNLOAD_BASE_URL:http://192.168.1.168:7081}
    max-file-size-mb: ${CONTENT_PUBLISH_V2_MAX_FILE_SIZE_MB:6144}
    temp-file-ttl-ms: ${CONTENT_PUBLISH_V2_TEMP_FILE_TTL_MS:7800000}
    delivery-timeout-ms: ${CONTENT_PUBLISH_V2_DELIVERY_TIMEOUT_MS:7200000}

secure-publish:
  permit:
    hmac-secret: ${SIGMA_PERMIT_HMAC_SECRET:ChangeMe_Sigma_Permit_Secret_32Bytes!}

logging:
  level:
    com.infopublish: INFO
    org.apache.ibatis: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS, Asia/Shanghai} [%thread] %-5level %logger{50} - %msg%n"
